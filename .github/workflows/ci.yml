name: CI

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify
        run: mvn -B verify
      - name: Dependency inventory
        if: always()
        run: mvn -B dependency:tree

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        uses: docker://zricethezav/gitleaks:v8.30.1
        with:
          args: git --no-banner --redact --exit-code 1 /github/workspace

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and verify hardened image
        run: ./scripts/verify-container.sh user-management-gateway:ci
      - name: Scan image for Critical and High vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: user-management-gateway:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
