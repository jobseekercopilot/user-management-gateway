openapi: 3.0.1
info:
  title: Jobseeker Copilot - Authentication Service API
  version: 1.0.0
  description: Consumer contract used by user-management-gateway.
x-source-repository: jobseekercopilot/authentication-service
x-source-revision: 9e1ca7d26b23c4bd669f9121245569f2913f3d09
paths:
  /api/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountResponse'
components:
  schemas:
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
    UserAccountResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
