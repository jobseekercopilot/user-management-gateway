openapi: 3.0.1
info:
  title: Jobseeker Copilot - Authentication Service API
  version: 1.1.0
  description: Consumer contract used by user-management-gateway.
x-source-repository: jobseekercopilot/authentication-service
x-source-revision: 194f74887b8637485e1afc24b3187cf86c4bd23f
paths:
  /api/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountResponse'
  /api/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Session revoked
  /api/auth/password-reset/request:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/auth/password-reset/complete:
    post:
      tags: [Authentication]
      operationId: completePasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCompletionRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/auth/account/export:
    get:
      tags: [Account lifecycle]
      operationId: exportPersonalData
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Owner-scoped synchronous personal-data export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalDataExport'
  /api/auth/account:
    delete:
      tags: [Account lifecycle]
      operationId: deleteAccount
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$'
      responses:
        '202':
          description: Deletion operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionResponse'
components:
  schemas:
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
    PasswordResetCompletionRequest:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
    UserAccountResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
    PersonalDataExport:
      type: object
      required: [schemaVersion, generatedAt, account, profile, applications, documents]
      properties:
        schemaVersion:
          type: string
        generatedAt:
          type: string
          format: date-time
        account:
          $ref: '#/components/schemas/UserAccountResponse'
        profile:
          type: object
          additionalProperties: true
        applications:
          type: object
          additionalProperties: true
        documents:
          type: object
          additionalProperties: true
    AccountDeletionResponse:
      type: object
      required: [operationId, status, acceptedAt]
      properties:
        operationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, RETRY_REQUIRED, COMPLETED]
        acceptedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
