server.port=8083
spring.application.name=user-management-gateway
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,downstreamDependencies
management.endpoint.health.group.readiness.show-details=always
authentication.service.url=${AUTHENTICATION_SERVICE_URL:http://localhost:8084}
authentication.service.token=${AUTHENTICATION_SERVICE_TOKEN}
user.profile.service.url=${USER_PROFILE_SERVICE_URL:http://localhost:8085}
downstream.connect-timeout-ms=${DOWNSTREAM_CONNECT_TIMEOUT_MS:500}
downstream.read-timeout-ms=${DOWNSTREAM_READ_TIMEOUT_MS:2000}
downstream.retry.max-attempts=${DOWNSTREAM_RETRY_MAX_ATTEMPTS:2}
downstream.circuit.failure-threshold=${DOWNSTREAM_CIRCUIT_FAILURE_THRESHOLD:3}
downstream.circuit.open-duration-ms=${DOWNSTREAM_CIRCUIT_OPEN_DURATION_MS:30000}
downstream.bulkhead.max-concurrent=${DOWNSTREAM_BULKHEAD_MAX_CONCURRENT:32}
gateway.request.maximum-body-bytes=${GATEWAY_REQUEST_MAXIMUM_BODY_BYTES:65536}
gateway.session.access-cookie-name=${GATEWAY_ACCESS_COOKIE_NAME:jsc-access-local}
gateway.session.refresh-cookie-name=${GATEWAY_REFRESH_COOKIE_NAME:jsc-refresh-local}
gateway.session.csrf-cookie-name=${GATEWAY_CSRF_COOKIE_NAME:jsc-csrf-local}
gateway.session.secure-cookies=${GATEWAY_SECURE_COOKIES:false}
gateway.session.access-maximum-seconds=${GATEWAY_ACCESS_MAXIMUM_SECONDS:900}
gateway.session.refresh-maximum-seconds=${GATEWAY_REFRESH_MAXIMUM_SECONDS:604800}
gateway.session.refresh-concurrency-seconds=${GATEWAY_REFRESH_CONCURRENCY_SECONDS:5}
gateway.session.refresh-concurrency-maximum=${GATEWAY_REFRESH_CONCURRENCY_MAXIMUM:1000}
gateway.security.allowed-origins=${GATEWAY_ALLOWED_ORIGINS:http://localhost:4200}
gateway.security.auth-rate-maximum=${GATEWAY_AUTH_RATE_MAXIMUM:20}
gateway.security.auth-rate-global-maximum=${GATEWAY_AUTH_RATE_GLOBAL_MAXIMUM:1000}
gateway.security.auth-rate-window-seconds=${GATEWAY_AUTH_RATE_WINDOW_SECONDS:60}
gateway.security.auth-rate-maximum-clients=${GATEWAY_AUTH_RATE_MAXIMUM_CLIENTS:10000}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n
logging.level.com.jobseekercopilot=${APP_LOG_LEVEL:INFO}
# Spring Web DEBUG output renders generated auth DTOs, including credentials.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
